spring.application.name=email-service

resend.api-key=test-key
resend.api-url=https://api.resend.com/emails
app.email.from=test@example.com
app.email.sender-name=Integrated Online Shopping System

# In-memory database, deliberately not MySQL.
#
# This previously pointed at jdbc:mysql://localhost:3306/email_test with
# username test. No such database or user exists, so every build printed a
# Hibernate "Access denied for user 'test'@'localhost'" stack trace and spent
# about 24 seconds waiting on the connection. The suite passed anyway only
# because ddl-auto=none meant the failed connection was never fatal - which
# made a green build contingent on how a given machine's local MySQL happened
# to answer, rather than on the code.
#
# H2 in MySQL compatibility mode keeps the dialect close to production while
# removing the external dependency entirely.
spring.datasource.url=jdbc:h2:mem:email_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
