spring.application.name=email-service
# Server
server.port=8080

# Resend API (https://resend.com) — set RESEND_API_KEY in Railway
resend.api-key=${RESEND_API_KEY}
resend.api-url=https://api.resend.com/emails

# Sender — must be a verified domain in your Resend account
# For testing you can use onboarding@resend.dev (Resend's shared domain)
app.email.from=${EMAIL_FROM:onboarding@resend.dev}
app.email.sender-name=${EMAIL_SENDER_NAME:Integrated Online Shopping System}

# Database
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
